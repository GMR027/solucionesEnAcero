# ===========================================================================
# Secret — credenciales del sitio. Los valores llegan de values.local.yaml.
# ===========================================================================
apiVersion: v1
kind: Secret
metadata:
  name: solucionesenacero
  namespace: {{ .Release.Namespace }}
  labels:
    app: solucionesenacero
type: Opaque
stringData:
  DB_PASSWORD: {{ required "secrets.dbPassword requerido (values.local.yaml)" .Values.secrets.dbPassword | quote }}
  {{- if lt (len .Values.secrets.portalFotosSecreto) 32 }}
  {{- fail "secrets.portalFotosSecreto requerido, minimo 32 caracteres (values.local.yaml)" }}
  {{- end }}
  PORTAL_FOTOS_SECRETO: {{ .Values.secrets.portalFotosSecreto | quote }}
